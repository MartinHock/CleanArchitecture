name: Renovate POC

on:
  push:
    branches:
      - poc/renovate-grouped-updates
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout POC branch
        uses: actions/checkout@v7.0.1
        with:
          ref: poc/renovate-grouped-updates

      - name: Run Renovate
        uses: renovatebot/github-action@v46.2.3
        with:
          configurationFile: .github/renovate-poc-config.js
          token: ${{ github.token }}
        env:
          LOG_LEVEL: info
