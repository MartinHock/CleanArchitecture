name: Cross-Platform Build & Test (Clean Architecture)

on:
  push:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Clean.Architecture.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/cross-platform-build-test.yml'
  pull_request:
    branches:
      - '**'
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Clean.Architecture.slnx'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'global.json'
      - '.github/workflows/cross-platform-build-test.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ${{ matrix.os }}
    
    # Matrix strategy tests all OS combinations
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]  # All major platforms
        configuration: [Release]
      fail-fast: false  # Continue other jobs if one fails - get full picture

    steps:
      # v6 uses Node.js 24 (v4 uses deprecated Node.js 20)
      # fetch-depth: 0 gets full history (needed for some versioning tools)
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # v5 uses Node.js 24, 'ga' ensures stable .NET 10 release
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'  # General Availability - stable release

      # Explicit restore with environment vars for faster first-run
      - name: Restore dependencies
        run: dotnet restore Clean.Architecture.slnx --verbosity normal
        env:
          DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true  # Skip .NET welcome message
          DOTNET_CLI_TELEMETRY_OPTOUT: true  # Disable telemetry for faster CI

      # --no-restore skips redundant package restore
      - name: Build (${{ matrix.configuration }})
        run: dotnet build Clean.Architecture.slnx --configuration ${{ matrix.configuration }} --no-restore --verbosity minimal

      # MTP v2 writes TRX and Cobertura reports to the requested results directory.
      - name: Run Unit Tests (${{ matrix.configuration }})
        run: dotnet test --project tests/Clean.Architecture.UnitTests/Clean.Architecture.UnitTests.csproj --configuration ${{ matrix.configuration }} --no-build --minimum-expected-tests 1 --results-directory TestResults/UnitTests -- --report-trx --coverage --coverage-output-format cobertura

      # Integration tests - may have external dependencies
      - name: Run Integration Tests (${{ matrix.configuration }})
        run: dotnet test --project tests/Clean.Architecture.IntegrationTests/Clean.Architecture.IntegrationTests.csproj --configuration ${{ matrix.configuration }} --no-build --minimum-expected-tests 1 --results-directory TestResults/IntegrationTests -- --report-trx --coverage --coverage-output-format cobertura

      # Functional tests - filter excludes Docker-dependent tests in CI
      - name: Run Functional Tests
        run: dotnet test --project tests/Clean.Architecture.FunctionalTests/Clean.Architecture.FunctionalTests.csproj --configuration ${{ matrix.configuration }} --no-build --minimum-expected-tests 1 --results-directory TestResults/FunctionalTests -- --report-trx --coverage --coverage-output-format cobertura --filter-not-class Clean.Architecture.FunctionalTests.DockerAvailabilityTests
        env:
          SKIP_SQL_SERVER_CONTAINER: ${{ matrix.os != 'ubuntu-latest' }}

      # Upload test results even if tests failed (if: always())
      # Retention 30 days balances storage costs and debugging needs
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.configuration }}
          path: 'TestResults/**/*.trx'
          retention-days: 30

      # Code coverage reports for quality tracking
      - name: Upload Coverage
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.configuration }}
          path: 'TestResults/**/*.cobertura.xml'
          retention-days: 30
