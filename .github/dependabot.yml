version: 2
updates:
- package-ecosystem: nuget
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  groups:
    microsoft-packages-patch:
      patterns:
      - "Microsoft.*"
      exclude-patterns:
      - "Microsoft.NET.Test.Sdk"
      update-types:
      - patch

    microsoft-packages-minor:
      patterns:
      - "Microsoft.*"
      exclude-patterns:
      - "Microsoft.NET.Test.Sdk"
      update-types:
      - minor

    test-packages-patch:
      patterns:
      - "Microsoft.NET.Test.Sdk"
      - "xunit*"
      - "NUnit*"
      - "coverlet*"
      - "FluentAssertions"
      update-types:
      - patch

    test-packages-minor:
      patterns:
      - "Microsoft.NET.Test.Sdk"
      - "xunit*"
      - "NUnit*"
      - "coverlet*"
      - "FluentAssertions"
      update-types:
      - minor

    all-other-non-major-patch:
      patterns:
      - "*"
      exclude-patterns:
      - "Microsoft.*"
      - "Microsoft.NET.Test.Sdk"
      - "xunit*"
      - "NUnit*"
      - "coverlet*"
      - "FluentAssertions"
      update-types:
      - patch

    all-other-non-major-minor:
      patterns:
      - "*"
      exclude-patterns:
      - "Microsoft.*"
      - "Microsoft.NET.Test.Sdk"
      - "xunit*"
      - "NUnit*"
      - "coverlet*"
      - "FluentAssertions"
      update-types:
      - minor

